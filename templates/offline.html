<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>انقطاع الاتصال بالإنترنت | مبادرة 1000 برمجة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .offline-card {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 3rem 2rem;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        .offline-icon {
            width: 90px;
            height: 90px;
            background: rgba(59, 130, 246, 0.1);
            color: #3b82f6;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="offline-icon">
            <i class="fas fa-wifi-slash"></i>
        </div>
        <h3 class="fw-bold mb-3">أنت غير متصل بالإنترنت</h3>
        <p class="text-slate-400 text-muted mb-4">
            تأكد من الاتصال بالشبكة لكي تتمكن من الوصول لجميع خدمات منصة 1000 برمجة وتحديث سجلات الحضور.
        </p>
        <button onclick="window.location.reload()" class="btn btn-primary btn-lg rounded-pill px-5 shadow-lg">
            <i class="fas fa-sync-alt me-2"></i>إعادة المحاولة الآن
        </button>
    </div>
</body>
</html>
